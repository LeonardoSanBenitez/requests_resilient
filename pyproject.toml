[build-system]
requires      = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requests_resilient"
version = "0.3.1"
description = "Automatic retry and resilience for the requests library"
readme = "README.md"
authors = [{ name = "Leonardo Benitez", email = "lsbenitezpereira@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["requests", "resilience", "retry", "http", "backoff"]
dependencies = ["requests>=2.31.0"]
requires-python = ">=3.10"

    [project.optional-dependencies]
    dev = [
        "pytest>=8.0",
        "mypy>=1.10",
        "types-requests>=2.31",
        "ruff>=0.6",
    ]
    build = ["build", "twine"]

    [project.urls]
    repository    = "https://github.com/LeonardoSanBenitez/requests_resilient"
    documentation = "https://github.com/LeonardoSanBenitez/requests_resilient"
    changelog     = "https://github.com/LeonardoSanBenitez/requests_resilient/blob/main/CHANGELOG.md"
    issues        = "https://github.com/LeonardoSanBenitez/requests_resilient/issues"

[tool.setuptools.package-data]
requests_resilient = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 190
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E226"]
