name: Feature request
description: Request a new feature for requests_resilient
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you are trying to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like the library to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
    validations:
      required: false
