name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' to confirm release"
        required: true
        default: ""

permissions:
  id-token: write   # required for PyPI trusted publisher (OIDC)
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'publish' }}
    environment:
      name: pypi
      url: https://pypi.org/project/requests_resilient/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Install dev dependencies (for pre-publish test run)
        run: pip install -e ".[dev]"

      - name: Run tests before publishing
        run: pytest tests/ -v --tb=short

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
